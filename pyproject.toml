[project]
name = "mensapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "furukawa", email = "dkszoeke@outlook.de" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "typing>=3.10.0.0",
]

[project.scripts]
mensapi = "mensapi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
